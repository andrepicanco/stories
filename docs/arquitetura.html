<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do Stories</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2330; --muted:#5d6577; --line:#d9d3c5;
  --zone:rgba(60,70,100,.06); --zone-line:rgba(60,70,100,.35);
  --edge:#7a8296; --accent:#d9480f; --halo:#f4f1ea; --btn:#ece7da;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151922; --panel:#1c212c; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2d3446;
    --zone:rgba(160,175,220,.07); --zone-line:rgba(160,175,220,.35);
    --edge:#8c95ab; --accent:#ff8a4c; --halo:#151922; --btn:#2a3142;
  }
}
:root[data-theme="dark"]{
  --bg:#151922; --panel:#1c212c; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2d3446;
  --zone:rgba(160,175,220,.07); --zone-line:rgba(160,175,220,.35);
  --edge:#8c95ab; --accent:#ff8a4c; --halo:#151922; --btn:#2a3142;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .sp{flex:1}
header .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header .grp small{color:var(--muted)}
button,.sw{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.sw{display:inline-flex;align-items:center;gap:8px;user-select:none;padding:5px 10px}
.sw .knob{width:34px;height:18px;border-radius:9px;background:#9aa0ad;position:relative;transition:.2s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on .knob{background:#2f9e44}.sw.on .knob::after{left:18px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 410px}
#stage{position:relative;overflow:hidden;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px}
aside h2{font-size:18px;margin:0 0 2px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 0 4px}
aside p{margin:4px 0}
.file{display:inline-block;font:12px ui-monospace,Consolas,monospace;background:var(--btn);border-radius:5px;padding:1px 7px;color:var(--muted)}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--btn);border-radius:4px;padding:0 4px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 ui-monospace,Consolas,monospace;overflow:auto;white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:2px 10px;font-size:13px}
#tour{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none}
#tour .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.6px}
#tour h2{font-size:16px}
#tour .nav{display:flex;gap:8px;margin-top:8px}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:calc(100% - 24px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;padding:4px 0}
/* svg */
.node{cursor:pointer;transition:opacity .25s}
.node:hover .top{filter:brightness(1.07)}
.node.sel{filter:drop-shadow(0 0 7px var(--accent))}
.node.dim,.edge.dim,.elabel.dim{opacity:.18}
.node.off{opacity:.5}
.edge path{fill:none;stroke:var(--edge);stroke-width:2.2;stroke-dasharray:7 6;animation:dash 1s linear infinite;transition:opacity .25s}
.edge.act path{stroke:var(--accent);stroke-width:3.6}
.edge.off path{stroke-dasharray:2 6;animation:none;opacity:.35}
@keyframes dash{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.edge path{animation:none}}
.elabel{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none;transition:opacity .25s}
.zlabel{font-size:12px;font-weight:700;letter-spacing:1px;fill:var(--muted);text-transform:uppercase}
.t1{font-size:12.5px;font-weight:700;fill:#1d2330;pointer-events:none;text-anchor:middle}
.t2{font:10.5px ui-monospace,Consolas,monospace;fill:#3b4357;pointer-events:none;text-anchor:middle}
/* ?embed: só o mapa (usado para gerar a imagem do README) */
body.embed header,body.embed aside,body.embed .hint,body.embed .zoom{display:none}
body.embed main{grid-template-columns:1fr;grid-template-rows:1fr}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 46vh}
  aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <h1>🗺️ Mapa do Stories</h1>
  <button class="primary" id="btnTour">▶ Tour guiado</button>
  <span class="grp">
    <small>Fontes de contexto da tela:</small>
    <span class="sw on" data-grp="notion" role="switch" aria-checked="true" tabindex="0" title="Checkbox Notion da tela"><span class="knob"></span><span>Notion</span></span>
    <span class="sw on" data-grp="azure" role="switch" aria-checked="true" tabindex="0" title="Checkbox Azure DevOps da tela"><span class="knob"></span><span>Azure DevOps</span></span>
    <span class="sw on" data-grp="obsidian" role="switch" aria-checked="true" tabindex="0" title="Checkbox Obsidian da tela"><span class="knob"></span><span>Obsidian</span></span>
  </span>
  <span class="sp"></span>
  <button id="btnTheme" title="Alternar tema">◐</button>
</header>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Mapa isométrico da arquitetura do Stories">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="context-stroke"/>
        </marker>
      </defs>
      <g id="view"><g id="scene"></g></g>
    </svg>
    <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit" title="Ajustar">⤢</button></div>
    <div class="hint">Arraste para mover · roda do mouse para zoom · clique nos blocos · ← → no tour</div>
  </div>
  <aside id="panel">
    <div id="tour"></div>
    <div id="detail"></div>
  </aside>
</main>

<script>

const N = [
 /* ---------- NAVEGADOR ---------- */

const scene=document.getElementById('scene');
function activeSet(){
  if(st.step<0)return null;
  const s=STEPS[st.step];
  return {nodes:new Set(s.nodes),edges:new Set(s.edges)};
}
function draw(){
  scene.replaceChildren();
  const act=activeSet();

  for(const z of ZONES){
    el('polygon',{points:pts([P(z.x0,z.y0),P(z.x1,z.y0),P(z.x1,z.y1),P(z.x0,z.y1)]),fill:'var(--zone)',stroke:'var(--zone-line)','stroke-dasharray':'6 5','stroke-width':1.5},scene);
    const [lx,ly]=z.r?P(z.x1,z.y0):P(z.x0,z.y1);
    const t=el('text',{x:z.r?lx+10:lx-10,y:ly+4,class:'zlabel','text-anchor':z.r?'start':'end'},scene);t.textContent=z.n;
  }
  const labels=[];
  for(const e of E){
    const off=isOff(e);
    const g=el('g',{class:'edge'+(off?' off':'')+(act&&act.edges.has(e.id)&&!off?' act':'')+(act&&!act.edges.has(e.id)?' dim':'')},scene);
    el('path',{d:'M'+e.pts.map(p=>P(...p).join(',')).join('L'),'marker-end':'url(#arr)','marker-start':e.both?'url(#arr)':'none'},g);
    if(e.label){
      const lp=e.lp||[(e.pts[0][0]+e.pts[e.pts.length-1][0])/2,(e.pts[0][1]+e.pts[e.pts.length-1][1])/2];
      labels.push({e,lp,off,dim:act&&!act.edges.has(e.id)});
    }
  }
  const order=[...N].sort((a,b)=>(a.x+a.w+a.y+a.d)-(b.x+b.w+b.y+b.d));
  for(const n of order){
    const off=isOff(n);
    const dim=act&&!act.nodes.has(n.id);
    const cls='node'+(off?' off':'')+(dim?' dim':'')+(st.sel===n.id?' sel':'');
    const g=el('g',{class:cls,'data-id':n.id},scene);
    const sat=off?6:Math.round(58*(n.sat??1)), h=n.hue;
    let top=`hsl(${h},${sat}%,${n.disk?84:87}%)`, left=`hsl(${h},${Math.round(sat*.85)}%,${n.disk?66:70}%)`, right=`hsl(${h},${Math.round(sat*.8)}%,${n.disk?55:58}%)`;
    const {x,y,w,d,h:H}=n, stroke=`hsl(${h},30%,32%)`;
    el('polygon',{points:pts([P(x,y+d,H),P(x+w,y+d,H),P(x+w,y+d,0),P(x,y+d,0)]),fill:left,stroke,'stroke-width':.8},g);
    el('polygon',{points:pts([P(x+w,y,H),P(x+w,y+d,H),P(x+w,y+d,0),P(x+w,y,0)]),fill:right,stroke,'stroke-width':.8},g);
    el('polygon',{class:'top',points:pts([P(x,y,H),P(x+w,y,H),P(x+w,y+d,H),P(x,y+d,H)]),fill:top,stroke,'stroke-width':.8},g);
    const [cx,cy]=P(x+w/2,y+d/2,H);
    const big=n.id==='harness';
    const t1=el('text',{x:cx,y:cy-(n.small?1:3),class:'t1',style:big?'font-size:16px':n.small?'font-size:11px':''},g);t1.textContent=n.icon+' '+n.name;
    const t2=el('text',{x:cx,y:cy+(n.small?11:13),class:'t2',style:n.small?'font-size:9.5px':''},g);t2.textContent=n.file.length>24?n.file.slice(0,23)+'…':n.file;
    g.addEventListener('click',()=>{ if(!moved) select(n.id); });
  }
  for(const l of labels){
    const [x,y]=P(...l.lp);
    const t=el('text',{x,y:y-4,class:'elabel'+(l.dim?' dim':''),'text-anchor':'middle'},scene);
    t.textContent=l.e.label;
    if(l.off)t.setAttribute('opacity','.35');
  }
}

function renderTour(){
  if(st.step<0){tourBox.style.display='none';return}
  const s=STEPS[st.step];
  tourBox.style.display='block';
  tourBox.innerHTML=`<div class="n">PASSO ${st.step+1} DE ${STEPS.length}</div><h2>${esc(s.t)}</h2><p>${esc(s.x(st.grp))}</p>
    <div class="nav"><button id="tPrev" ${st.step===0?'disabled':''}>◀ Anterior</button>
    <button class="primary" id="tNext">${st.step===STEPS.length-1?'↺ Recomeçar':'Próximo ▶'}</button>
    <button id="tEnd">Sair</button></div>`;
  document.getElementById('tPrev').onclick=()=>go(st.step-1);
  document.getElementById('tNext').onclick=()=>go(st.step===STEPS.length-1?0:st.step+1);
  document.getElementById('tEnd').onclick=()=>go(-1);
}
detail.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){select(b.dataset.go||null);if(b.dataset.go)focusNode(b.dataset.go)}});

function refresh(){draw();renderDetail();renderTour();document.getElementById('btnTour').textContent=st.step<0?'▶ Tour guiado':'■ Parar tour'}
function select(id){st.sel=id;refresh()}
function go(i){st.step=i;refresh()}
function toggleGrp(g){
  st.grp[g]=!st.grp[g];
  const sw=document.querySelector(`.sw[data-grp="${g}"]`);
  sw.classList.toggle('on',st.grp[g]);sw.setAttribute('aria-checked',st.grp[g]);
  refresh();
}
document.querySelectorAll('.sw[data-grp]').forEach(sw=>{
  sw.onclick=()=>toggleGrp(sw.dataset.grp);
  sw.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleGrp(sw.dataset.grp)}};
});
document.getElementById('btnTour').onclick=()=>go(st.step<0?0:-1);
document.getElementById('btnTheme').onclick=()=>{
  const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#151922';
  r.setAttribute('data-theme',dark?'light':'dark');
};
addEventListener('keydown',e=>{
  if(st.step<0)return;
  if(e.key==='ArrowRight'&&st.step<STEPS.length-1)go(st.step+1);
  if(e.key==='ArrowLeft'&&st.step>0)go(st.step-1);
  if(e.key==='Escape')go(-1);
});

/* ============================================================
   PAN / ZOOM
   ============================================================ */
const stage=document.getElementById('stage'), svg=document.getElementById('svg'), view=document.getElementById('view');
let V={x:0,y:0,k:1}, moved=false;
const applyV=()=>view.setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.k})`);
function fit(){
  const b=scene.getBBox(), W=stage.clientWidth, H=stage.clientHeight, pad=40;
  V.k=Math.min((W-pad)/b.width,(H-pad)/b.height);
  V.x=(W-b.width*V.k)/2-b.x*V.k; V.y=(H-b.height*V.k)/2-b.y*V.k; applyV();
}
function zoomAt(f,cx,cy){
  const k=Math.min(4,Math.max(.25,V.k*f)); f=k/V.k;
  V.x=cx-(cx-V.x)*f; V.y=cy-(cy-V.y)*f; V.k=k; applyV();
}
function focusNode(id){
  const n=NB[id], [sx,sy]=P(n.x+n.w/2,n.y+n.d/2,n.h);
  V.x=stage.clientWidth/2-sx*V.k; V.y=stage.clientHeight/2-sy*V.k; applyV();
}
let drag=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;drag={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y};moved=false});
addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true;stage.classList.add('drag')}
  if(moved){V.x=drag.vx+dx;V.y=drag.vy+dy;applyV()}
});
addEventListener('pointerup',e=>{
  if(!drag)return;
  const wasMoved=moved; drag=null; stage.classList.remove('drag');
  if(!wasMoved && !e.target.closest('.node') && !e.target.closest('.zoom')) select(null);
  setTimeout(()=>moved=false,0);
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);
},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(.8,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('zfit').onclick=fit;
addEventListener('resize',fit);

if(/embed/.test(location.search))document.body.classList.add('embed');
if(/theme=dark/.test(location.search))document.documentElement.setAttribute('data-theme','dark');
if(/theme=light/.test(location.search))document.documentElement.setAttribute('data-theme','light');
refresh(); fit();
